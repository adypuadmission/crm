<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Login | ADYPU Admission Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin.css">
</head>
<body class="login-body">
  <div class="orb orb-a"></div><div class="orb orb-b"></div>
  <form class="login-card" id="loginForm">
    <div class="crest">🎓</div>
    <p class="eyebrow">ADYPU Admission Desk</p>
    <h1>Sign in</h1>
    <p class="login-sub">Main admin &amp; sub-admin (counsellor) accounts</p>
    <label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <div id="otpStep" hidden>
      <p class="otp-msg" id="otpMsg"></p>
      <label>Login code (OTP)<input name="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" pattern="\d{6}"></label>
    </div>
    <button type="submit" class="btn primary wide">Sign in</button>
    <p class="sec-note">🔐 Protected area · every sign-in and action is recorded</p>
    <p class="err" id="err" role="alert"></p>
    <a class="back" href="/">← Back to enquiry form</a>
  </form>
<script src="/login.js"></script>
</body>
</html>
