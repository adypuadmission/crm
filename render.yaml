services:
  - type: web
    name: adypu-admission
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ACADEMIC_YEAR
        value: "2027–28"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_KEY            # encrypts student names, mobiles, emails. NEVER change or lose it.
        generateValue: true
      - key: ADMIN_NAME
        value: Dr. Atul Kathole
      - key: ADMIN_MOBILE        # admin login OTP + security alert SMS
        value: "9960889772"
      - key: OTP_DEMO_MODE
        value: "false"
      - key: FAST2SMS_API_KEY    # from fast2sms.com → Dev API (account registered on 9960889772)
        sync: false
      - key: FAST2SMS_CONFIRM_ROUTE
        value: q
      # WhatsApp (Meta Cloud API) from the ADMISSION OFFICE number — students get OTP + confirmation naming their counsellor; SMS is the fallback
      - key: MESSAGE_CHANNEL
        value: whatsapp
      - key: WA_TOKEN            # permanent System User access token from Meta Business
        sync: false
      - key: WA_PHONE_NUMBER_ID  # from WhatsApp Manager → API setup (not the mobile number)
        sync: false
      - key: WA_SENDER_MOBILE    # the office WhatsApp number used for sending (10 digits)
        sync: false
      - key: WA_ALERT_TEMPLATE   # Utility template with {{1}} = alert text → security alerts to the admin on WhatsApp
        value: adypu_security_alert
      - key: WA_OTP_TEMPLATE
        value: adypu_otp
      - key: WA_CONFIRM_TEMPLATE
        value: adypu_enquiry_confirm
      - key: ALERT_EMAIL_TO
        sync: false
      - key: SMTP_HOST           # Gmail: use an App Password in SMTP_PASS
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMS_PROVIDER
        value: fast2sms
      - key: OTP_REQUIRED
        value: "true"
      - key: SEND_CONFIRMATION_SMS
        value: "true"
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        sync: false
      - key: MSG91_CONFIRM_TEMPLATE_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: adypu-admission-db
          property: connectionString
databases:
  - name: adypu-admission-db
    plan: free
